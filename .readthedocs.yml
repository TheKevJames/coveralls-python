version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install uv
    post_install:
      # Point uv at RTD's virtualenv; otherwise `uv sync` provisions its own
      # `.venv`, which the Sphinx build (run in $READTHEDOCS_VIRTUALENV_PATH)
      # never sees.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
