ci:
    autofix_commit_msg: 'refactor(lint): apply automatic lint fixes'
    autoupdate_commit_msg: 'chore(deps): bump pre-commit linter versions'

default_install_hook_types:
  - commit-msg
  - pre-commit

default_language_version:
    python: python3.10

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: example/.*
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

# python
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: name-tests-test
        exclude: tests/data/.*
      - id: requirements-txt-fixer
  - repo: https://github.com/PyCQA/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        args:
          - --max-line-length=99
          - --max-module-lines=500
          - --max-positional-arguments=10
          - --max-args=10
          - --score=n
          - -d broad-except
          - -d duplicate-code
          - -d fixme
          - -d import-error
          - -d invalid-name
          - -d locally-disabled
          - -d missing-docstring
          - -d too-few-public-methods
          - -d try-except-raise
          - -d ungrouped-imports  # conflicts with ruff isort
          - -d wrong-import-order  # conflicts with ruff isort
        exclude: nonunicode/.*
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-crlf
      - id: remove-tabs
        exclude: 'Makefile'
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        require_serial: True
        language: python
        # N.B. mypy requires an installed version of whatever third-party
        # library it is asked to check against. In practice, that means
        # whenever we see an error telling us to do so, we should add the
        # relevant library to `additional_dependencies`.
        # Note that some libraries keep their type hints in packages named
        # `types-$lib` or `$lib-stubs`.
        additional_dependencies:
          - coverage==7.15.4
          - pytest==9.1.1
          - responses==0.26.2
          - types-pyyaml==6.0.12.20260906
          - types-requests==2.33.0.20260712
          - typer==0.27.1
        args:
          - --show-error-codes
          - --strict
          - --strict-equality
          - --warn-unreachable
        exclude: '^(example|nonunicode|tests/data)/'
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        language: python
        additional_dependencies:
          - flake8-broken-line==1.0.0
          - flake8-complicated-walrus==2.1.0
          - flake8-import-restrictions==2.1
        args:
          # https://www.flake8rules.com/
          # Restrict flake8 to plugins with no ruff equivalent; core
          # pyflakes/pycodestyle (E/W/F) are handled by ruff.
          # FCW: flake8-complicated-walrus
          # IMR: flake8-import-restrictions
          # N400: flake8-broken-line
          # IMR200: Imports should only happen on module level, not locally. Covered by pylint.
          # IMR241: When using 'from', import submodules not elements.
          - --select=FCW,IMR,N400
          - --ignore=IMR200,IMR241
  # TODO: use ruff once more refurb ruloes are out of preview
  - repo: https://github.com/dosisod/refurb
    rev: v2.3.1
    hooks:
      - id: refurb
        args:
          - --python-version
          - '3.10'
  # TODO: add more rules from https://docs.astral.sh/ruff/rules/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args:
          - --fix
          - --target-version
          - py310
          - --select
          - A,C4,C901,D,E,F,G010,I,RUF006,RUF100,S307,T10,TRY,UP,W,YTT
          - --config
          - lint.mccabe.max-complexity = 10
          # Codes owned by flake8 plugins with no ruff equivalent; keeps
          # RUF100 from stripping their noqa directives.
          - --config
          - lint.external = ['N400', 'FCW', 'IMR']
          - --config
          - lint.isort.force-single-line = true
          # D1,D203,D205,D212,D400,D401,D404,D407,D412,D413: pydocstyle opinions.
          # E501: Line too long. Covered by ruff format.
          # E741: Do not use variables named 'I', 'O', or 'l'.
          # TRY003: Avoid long messages outside the exception class.
          # TRY301: Abstract raise to an inner function.
          - --ignore
          - D1,D203,D205,D212,D400,D401,D404,D407,D412,D413,E501,E741,TRY003,TRY301
        exclude: nonunicode/.*
      - id: ruff-format
        args:
          - --config
          - line-length = 79
          - --config
          - format.quote-style = 'single'
          - --config
          - format.skip-magic-trailing-comma = true
          # Silence the isort/formatter magic-comma incompatibility warning.
          - --config
          - lint.isort.split-on-trailing-comma = false
        exclude: nonunicode/.*
  - repo: local
    hooks:
      - id: poetry-check
        name: check pyproject.toml validity
        description: 'Validate the structure of the pyproject.toml file'
        entry: bash -c 'set -e; for toml in "$@"; do pushd ./${toml%pyproject.toml}; poetry check; popd; done' --
        language: python
        additional_dependencies:
          - poetry==2.4.2
        pass_filenames: true
        files: 'pyproject\.toml$'
      - id: pyproject-no-unpinned-git-deps
        name: disallow git dependencies without rev/tag
        description: 'Disallow Poetry/PDM git dependencies unless they are pinned with a rev or tag on the same line'
        # Flags lines that contain `git = "..."` but do NOT also contain `rev =` or `tag =`.
        entry: '^(?!\s*#)(?=[^#]*\bgit\s*=\s*"[^"]+")(?![^#]*\b(?:rev|tag)\s*=).*$'
        language: pygrep
        types: [toml]
        files: 'pyproject\.toml$'
      - id: pytest-fixtures-require-scope
        name: ensure pytest fixture scopes are explicitly set
        description: 'Ensure we explicitly set pytest fixture scopes'
        entry: '@pytest\.fixture( |\n|(\(\)))'
        language: pygrep
        types: [python]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-use-type-annotations

# rst
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

# json
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-circle-ci
      - id: check-github-workflows
      - id: check-renovate
        language: python
        additional_dependencies:
          - pyjson5==2.0.1

# docker
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args:
          - --ignore=DL3025

# java
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-java
        args: [--autofix]

# kotlin
      - id: pretty-format-kotlin
        args: [--autofix]

# terraform
  - repo: https://github.com/AleksaC/terraform-py
    rev: v1.16.1
    hooks:
      - id: tf-validate
  - repo: https://github.com/AleksaC/tffumpt
    rev: v0.1.1
    hooks:
      - id: tffumpt
  - repo: https://github.com/AleksaC/tflint-py
    rev: v0.64.0
    hooks:
      - id: tflint

# shell
  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        args: [--max-line-length=80]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: script-must-not-have-extension
