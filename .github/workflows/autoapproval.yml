name: autoapproval

# The only reason .github/actions-permissions.json lets Actions approve pull
# requests. That is safe only because this job runs none of the PR's code: it
# must never check it out or run it.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  autoapproval:
    # Only PRs which have been created (pull_request.user) and pushed
    # (sender.login) by Renovate should be autoapproved, which will let
    # Renovate automerge them. Everything else needs a human review.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.sender.login == 'renovate[bot]'
      && contains(github.event.pull_request.body, '**Automerge**: Enabled')
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve
