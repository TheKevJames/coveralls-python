name: ci

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.4
          # renovate: datasource=docker depName=python
          python-version: 3.15.0
      - uses: j178/prek-action@v3.1.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.7
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', 'pypy3.11', 'pypy3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: python -m pip install --upgrade pip tox tox-uv tox-gh-actions
      - run: tox
      - run: tox -e upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Merging a version change is the release: this pushes its tag, with the
  # `tag` environment's deploy key (see TheKevJames/tools _tag.yml), and the
  # tag push runs the jobs below.
  tag:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: TheKevJames/tools/.github/workflows/_tag.yml@master
    with:
      version-command: uv version --short
    secrets:
      TAG_DEPLOY_KEY: ${{ secrets.TAG_DEPLOY_KEY }}

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # For the check that the tag is on master.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.4
          # renovate: datasource=docker depName=python
          python-version: 3.15.0
      - name: validate tag matches pyproject.toml
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - name: validate the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::${GITHUB_REF_NAME} does not point at a commit on master"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, build]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/coveralls
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: TheKevJames/tools/.github/workflows/_github-release.yml@master
    with:
      artifact: dist
