name: repo-settings

# Reconciles repository settings with their definitions in .github/:
# rulesets/*.json (authoritative: unlisted rulesets and classic branch
# protection get deleted), actions-permissions.json, environments/*.json
# (authoritative: unlisted environments get deleted) and
# immutable-releases.json, and checks the deploy keys. See
# TheKevJames/tools/.github/workflows/_repo-settings.yml for the event -> mode
# mapping. Workflow changes are included since required checks are validated
# against workflow job names.

on:
  pull_request:
    paths:
      - .github/actions-permissions.json
      - .github/environments/**
      - .github/immutable-releases.json
      - .github/rulesets/**
      - .github/workflows/**
  push:
    # Path filters are not evaluated for tag pushes, so without this every tag
    # push would run.
    branches: ['**']
    paths:
      - .github/actions-permissions.json
      - .github/environments/**
      - .github/immutable-releases.json
      - .github/rulesets/**
      - .github/workflows/**
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-settings:
    uses: TheKevJames/tools/.github/workflows/_repo-settings.yml@master
    secrets:
      # Set via `repo-template set-secret`.
      REPO_SETTINGS_TOKEN: ${{ secrets.REPO_SETTINGS_TOKEN }}
